<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminder App - Email Notifications</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 2rem;
            color: #fff;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .status-box {
            background: #1a2e1a;
            border: 1px solid #22c55e;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #4ade80;
            line-height: 1.5;
            display: none;
        }
        .status-box.error {
            background: #2a1a1a;
            border-color: #ef4444;
            color: #f87171;
        }
        .status-box.show {
            display: block;
        }
        .card {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid #2a2a4a;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"],
        input[type="datetime-local"],
        textarea {
            width: 100%;
            padding: 12px 14px;
            background: #0f0f23;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        input:focus,
        textarea:focus {
            border-color: #6366f1;
        }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .quick-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .quick-btn {
            background: #0f0f23;
            border: 1px solid #333;
            color: #aaa;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .quick-btn:hover {
            border-color: #6366f1;
            color: #fff;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #6366f1;
            color: #fff;
        }
        .btn-primary:hover {
            background: #5558e3;
        }
        .btn-primary:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        .btn-danger {
            background: #ef4444;
            color: #fff;
            padding: 8px 14px;
            font-size: 0.85rem;
            width: auto;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .reminders-list {
            margin-top: 10px;
        }
        .reminder-item {
            background: #0f0f23;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .reminder-info {
            flex: 1;
        }
        .reminder-msg {
            font-weight: 500;
            color: #fff;
            margin-bottom: 4px;
            word-break: break-word;
        }
        .reminder-time {
            font-size: 0.85rem;
            color: #888;
        }
        .reminder-countdown {
            font-size: 0.9rem;
            color: #6366f1;
            font-weight: 600;
            margin-top: 4px;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .notification-perm {
            background: #1e3a5f;
            border: 1px solid #3b82f6;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
        }
        .notification-perm button {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1a1a2e;
            border: 1px solid #6366f1;
            border-radius: 12px;
            padding: 16px 20px;
            max-width: 320px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: toastIn 0.4s ease;
            z-index: 1000;
        }
        @keyframes toastIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .toast-title {
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }
        .toast-msg {
            color: #aaa;
            font-size: 0.9rem;
        }
        .sound-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-size: 0.9rem;
            color: #888;
        }
        .sound-toggle input {
            width: auto;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 8px;
        }
        .status-upcoming {
            background: #1e3a5f;
            color: #60a5fa;
        }
        .status-soon {
            background: #2a1a00;
            color: #fbbf24;
        }
        .status-now {
            background: #1a2e1a;
            color: #4ade80;
        }
        .email-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding: 10px 14px;
            background: #0f0f23;
            border-radius: 8px;
            border: 1px solid #333;
            font-size: 0.85rem;
            color: #888;
        }
        .email-info .icon {
            font-size: 1.1rem;
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <h1>⏰ Reminder</h1>
        <p class="subtitle">Set a reminder. Get an email + browser alert instantly.</p>

        <div id="statusBox" class="status-box"></div>

        <div class="email-info">
            <span class="icon">📧</span>
            <span>Emails will be sent to: <strong>thendralkaatrutv@gmail.com</strong></span>
        </div>

        <div id="permBanner" class="notification-perm" style="display:none;">
            <span>🔔 Enable browser notifications for alerts when tab is open.</span>
            <button onclick="requestNotificationPermission()">Enable</button>
        </div>

        <div class="card">
            <div class="form-group">
                <label for="message">Reminder Message</label>
                <textarea id="message" placeholder="What should I remind you about?"></textarea>
            </div>

            <div class="form-group">
                <label for="datetime">Date & Time</label>
                <input type="datetime-local" id="datetime">
                <div class="quick-buttons">
                    <button class="quick-btn" onclick="setQuickTime(5)">+5 min</button>
                    <button class="quick-btn" onclick="setQuickTime(15)">+15 min</button>
                    <button class="quick-btn" onclick="setQuickTime(30)">+30 min</button>
                    <button class="quick-btn" onclick="setQuickTime(60)">+1 hour</button>
                    <button class="quick-btn" onclick="setQuickTime(1440)">+1 day</button>
                    <button class="quick-btn" onclick="setQuickTime(10080)">+1 week</button>
                </div>
            </div>

            <div class="sound-toggle">
                <input type="checkbox" id="playSound" checked>
                <label for="playSound" style="margin:0; text-transform:none; letter-spacing:0; font-size:0.9rem; color:#888;">Play sound when reminder fires</label>
            </div>

            <button class="btn btn-primary" id="setBtn" onclick="addReminder()" style="margin-top:16px;">
                Set Reminder & Send Email
            </button>
        </div>

        <div class="card">
            <h3 style="margin-bottom:16px; font-size:1.1rem;">Active Reminders</h3>
            <div id="remindersList" class="reminders-list">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <p>No reminders set yet</p>
                </div>
            </div>
        </div>
    </div>

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        // EmailJS config
        const EMAILJS_SERVICE_ID = "service_c9jt6u2";
        const EMAILJS_TEMPLATE_ID = "37c1oxa";
        const EMAILJS_PUBLIC_KEY = "k-E8VQ9h5SiZ4VJUO";
        const USER_EMAIL = "thendralkaatrutv@gmail.com";

        // Initialize EmailJS
        emailjs.init(EMAILJS_PUBLIC_KEY);

        let reminders = JSON.parse(localStorage.getItem('reminders') || '[]');
        let audioCtx = null;

        // Check notification permission on load
        if ('Notification' in window && Notification.permission === 'default') {
            document.getElementById('permBanner').style.display = 'flex';
        }

        function requestNotificationPermission() {
            if (!('Notification' in window)) {
                showStatus("This browser does not support notifications", true);
                return;
            }
            Notification.requestPermission().then(perm => {
                document.getElementById('permBanner').style.display = 'none';
                if (perm === 'granted') {
                    new Notification('Reminders enabled!', {
                        body: 'You will now get browser notifications when reminders are due.'
                    });
                }
            });
        }

        function playBeep() {
            if (!document.getElementById('playSound').checked) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 880;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }

        function initDatetimeInput() {
            const now = new Date();
            now.setMinutes(now.getMinutes() + 5);
            now.setSeconds(0, 0);
            const pad = n => n.toString().padStart(2, '0');
            const str = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
            document.getElementById('datetime').value = str;
        }
        initDatetimeInput();

        function setQuickTime(minutesFromNow) {
            const now = new Date();
            now.setMinutes(now.getMinutes() + minutesFromNow);
            now.setSeconds(0, 0);
            const pad = n => n.toString().padStart(2, '0');
            const str = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
            document.getElementById('datetime').value = str;
        }

        function showStatus(msg, isError) {
            const box = document.getElementById('statusBox');
            box.textContent = msg;
            box.className = 'status-box show' + (isError ? ' error' : '');
            setTimeout(() => box.classList.remove('show'), 5000);
        }

        async function addReminder() {
            const msg = document.getElementById('message').value.trim();
            const datetimeVal = document.getElementById('datetime').value;

            if (!msg) {
                showStatus("Please enter a reminder message", true);
                return;
            }
            if (!datetimeVal) {
                showStatus("Please pick a date and time", true);
                return;
            }

            const fireAt = new Date(datetimeVal).getTime();
            const now = Date.now();

            if (fireAt <= now) {
                showStatus("That time is in the past. Pick a future time.", true);
                return;
            }

            const btn = document.getElementById('setBtn');
            btn.disabled = true;
            btn.textContent = "Sending email...";

            // Send email via EmailJS
            try {
                const fireDate = new Date(fireAt);
                const dateStr = fireDate.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                const timeStr = fireDate.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                const createdStr = new Date().toLocaleString();

                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    email: USER_EMAIL,
                    message: msg,
                    datetime: dateStr + " at " + timeStr,
                    created_at: createdStr
                });

                showStatus("Email sent! Check your inbox.");
            } catch (e) {
                showStatus("Email failed: " + (e.text || e.message), true);
                console.error("EmailJS error:", e);
                btn.disabled = false;
                btn.textContent = "Set Reminder & Send Email";
                return;
            }

            // Save reminder locally
            const reminder = {
                id: Date.now(),
                message: msg,
                fireAt: fireAt,
                createdAt: now,
                emailed: true
            };

            reminders.push(reminder);
            saveReminders();
            renderReminders();

            // Clear form
            document.getElementById('message').value = '';
            initDatetimeInput();

            btn.disabled = false;
            btn.textContent = "Set Reminder & Send Email";
        }

        function removeReminder(id) {
            reminders = reminders.filter(r => r.id !== id);
            saveReminders();
            renderReminders();
        }

        function saveReminders() {
            localStorage.setItem('reminders', JSON.stringify(reminders));
        }

        function formatTimeLeft(ms) {
            if (ms <= 0) return 'Firing now...';
            const seconds = Math.floor(ms / 1000);
            const mins = Math.floor(seconds / 60);
            const hrs = Math.floor(mins / 60);
            const days = Math.floor(hrs / 24);
            if (days > 0) return `${days}d ${hrs % 24}h ${mins % 60}m left`;
            if (hrs > 0) return `${hrs}h ${mins % 60}m ${seconds % 60}s left`;
            if (mins > 0) return `${mins}m ${seconds % 60}s left`;
            return `${seconds}s left`;
        }

        function getStatusBadge(ms) {
            const mins = ms / 60000;
            if (mins <= 1) return '<span class="status-badge status-now">NOW</span>';
            if (mins <= 10) return '<span class="status-badge status-soon">SOON</span>';
            return '<span class="status-badge status-upcoming">UPCOMING</span>';
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <div class="toast-title">⏰ Reminder!</div>
                <div class="toast-msg">${escapeHtml(message)}</div>
            `;
            document.body.appendChild(toast);
            playBeep();

            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('Reminder', {
                    body: message,
                    requireInteraction: true
                });
            }

            setTimeout(() => {
                toast.style.animation = 'toastIn 0.4s ease reverse';
                setTimeout(() => toast.remove(), 400);
            }, 8000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderReminders() {
            const list = document.getElementById('remindersList');
            const now = Date.now();
            reminders.sort((a, b) => a.fireAt - b.fireAt);
            const active = reminders.filter(r => r.fireAt > now);
            const fired = reminders.filter(r => r.fireAt <= now);

            fired.forEach(r => {
                showToast(r.message);
            });
            if (fired.length > 0) {
                reminders = active;
                saveReminders();
            }

            if (active.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        <p>No active reminders</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = active.map(r => {
                const timeLeft = r.fireAt - now;
                const fireDate = new Date(r.fireAt);
                const dateStr = fireDate.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
                const timeStr = fireDate.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                const emailBadge = r.emailed ? '<span style="color:#4ade80; font-size:0.75rem;">✓ Emailed</span>' : '';
                return `
                    <div class="reminder-item">
                        <div class="reminder-info">
                            <div class="reminder-msg">${escapeHtml(r.message)} ${getStatusBadge(timeLeft)}</div>
                            <div class="reminder-time">${dateStr} at ${timeStr} ${emailBadge}</div>
                            <div class="reminder-countdown" data-fire="${r.fireAt}">${formatTimeLeft(timeLeft)}</div>
                        </div>
                        <button class="btn btn-danger" onclick="removeReminder(${r.id})">Cancel</button>
                    </div>
                `;
            }).join('');
        }

        setInterval(() => {
            const now = Date.now();
            document.querySelectorAll('.reminder-countdown').forEach(el => {
                const fireAt = parseInt(el.dataset.fire);
                const left = fireAt - now;
                el.textContent = formatTimeLeft(left);
            });

            const fired = reminders.filter(r => r.fireAt <= now);
            if (fired.length > 0) {
                renderReminders();
            }
        }, 1000);

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) renderReminders();
        });

        renderReminders();
    </script>
</body>
</html>
